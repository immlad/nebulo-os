name: Deploy Nebulo OS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Upload the static Nebulo OS folder
      - name: Upload Nebulo OS artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./nebulo-os

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
